<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    :root { --bg: #faf7f2; --text: #1f1f1f; --muted: #6b6b6b; --accent: #e8643a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --text: #f2f2f2; --muted: #a0a0a0; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px; text-align: center;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin: 0 auto 24px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.02em; }
    p { color: var(--muted); margin-top: 12px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>Welcome</h1>
    <p>This site is live. More coming soon.</p>
  </main>
</body>
</html>
